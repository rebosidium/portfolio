  <!-- Keep this small modal shell in the document: the first tap must not wait
       for an ES module, frame archive, decoder or decorative GPU layer. -->
  <script>
  (()=>{
    const small=document.querySelector('[data-v3-avatar-small]');
    const dialog=document.querySelector('.v3-avatar-dialog');
    const viewer=dialog.querySelector('.v3-avatar-viewer');
    const large=dialog.querySelector('[data-v3-avatar-large]');
    const hide=dialog.querySelector('.v3-avatar-hide');
    const spin=dialog.querySelector('.v3-avatar-spin');
    const reduced=matchMedia('(prefers-reduced-motion:reduce)');
    let locked=null,closing=false,animation=null,gesture=null,generation=0;
    const afterPaint=callback=>requestAnimationFrame(()=>requestAnimationFrame(callback));
    const emit=name=>dialog.dispatchEvent(new Event(name));
    function lock(){
      const properties=['position','top','left','right','width'];
      locked={x:scrollX,y:scrollY,overflow:document.documentElement.style.overflow,styles:properties.map(p=>[p,document.body.style.getPropertyValue(p)])};
      const width=document.body.getBoundingClientRect().width;
      document.documentElement.style.overflow='hidden';
      Object.assign(document.body.style,{position:'fixed',top:-locked.y+'px',left:'0',right:'0',width:width+'px'});
    }
    function unlock(){
      if(!locked)return;const saved=locked;locked=null;
      document.documentElement.style.overflow=saved.overflow;
      for(const [p,v]of saved.styles){if(v)document.body.style.setProperty(p,v);else document.body.style.removeProperty(p);}
      scrollTo(saved.x,saved.y);
    }
    function open(){
      if(dialog.open||closing)return;
      const token=++generation,start=performance.now();
      // Paint the native top layer, poster and loader before allocating blur surfaces.
      dialog.dataset.opening='';lock();dialog.showModal();emit('v3-avatar-opening');
      if(!reduced.matches)animation=viewer.animate([{opacity:.6,transform:'scale(.985)'},{opacity:1,transform:'scale(1)'}],{duration:240,easing:'cubic-bezier(.22,1,.36,1)'});
      dialog.focus({preventScroll:true});
      afterPaint(()=>{
        if(!dialog.open||closing||token!==generation)return;
        dialog.dataset.firstPaintMs=(performance.now()-start).toFixed(1);
        delete dialog.dataset.opening;emit('v3-avatar-opened');
      });
    }
    async function close(){
      if(!dialog.open||closing)return;
      closing=true;++generation;animation?.cancel();emit('v3-avatar-closing');
      if(!reduced.matches){
        animation=viewer.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.96)'}],{duration:220,easing:'ease-in'});
        try{await animation.finished;}catch{}
      }
      dialog.close();animation?.cancel();animation=null;delete dialog.dataset.opening;
      unlock();small.dataset.returnFocus='true';small.focus({preventScroll:true});closing=false;emit('v3-avatar-closed');
    }
    small.addEventListener('pointerdown',event=>{gesture={x:event.clientX,y:event.clientY,moved:false};},{capture:true});
    small.addEventListener('pointermove',event=>{if(gesture&&Math.hypot(event.clientX-gesture.x,event.clientY-gesture.y)>6)gesture.moved=true;},{capture:true});
    small.addEventListener('click',event=>{if(event.detail!==0&&gesture?.moved){event.preventDefault();return;}open();});
    hide.addEventListener('click',close);
    dialog.addEventListener('cancel',event=>{event.preventDefault();close();});
    // A second tap and backdrop clicks are inert. Only Hide/Escape dismiss.
    dialog.addEventListener('keydown',event=>{
      if(event.key!=='Tab')return;
      const controls=[...(large.hasAttribute('tabindex')?[large]:[]),...(!spin.disabled?[spin]:[]),hide];
      const index=controls.indexOf(document.activeElement);event.preventDefault();
      controls[index<0?(event.shiftKey?controls.length-1:0):(index+(event.shiftKey?-1:1)+controls.length)%controls.length].focus({preventScroll:true});
    });
    small.addEventListener('blur',()=>{delete small.dataset.returnFocus;});
    document.addEventListener('keydown',event=>{if(['Tab','ArrowLeft','ArrowRight'].includes(event.key))delete small.dataset.returnFocus;});
    dialog.v3AvatarShell=Object.freeze({afterPaint,get closing(){return closing;}});
  })();
  </script>
