  <script>
// Runs in the head, before any header can paint. Waiting for navigation is
// distinct from the accessible no-JavaScript / failed-script fallback.
(() => {
  const root=document.documentElement;
  root.classList.add('navigation-js');
  window.mobileLayout=matchMedia('(max-width: 767px), (max-width: 1023px) and (pointer: coarse)');
  let requestedOpen=false;
  window.mobileNavigationReady=new Promise(resolve=>{window.resolveMobileNavigationReady=resolve;});
  window.releaseMobileNavigation=()=>{
    if(root.dataset.mobileNavReady==='true')return;
    root.classList.add('mobile-navigation-fallback');
    window.resolveMobileNavigationReady(false);
  };
  window.mobileNavigationDeadline=setTimeout(window.releaseMobileNavigation,3000);
  const earlyToggle=event=>{
    if(!window.mobileLayout.matches||root.dataset.mobileNavReady==='true'||!event.target.closest?.('.menu-toggle'))return;
    event.preventDefault();event.stopImmediatePropagation();requestedOpen=!requestedOpen;
  };
  document.addEventListener('click',earlyToggle,true);
  window.mobileNavigationReady.then(ready=>{
    document.removeEventListener('click',earlyToggle,true);
    if(ready&&requestedOpen&&window.mobileLayout.matches)document.querySelector('.menu-toggle')?.click();
  });
})();
  </script>

  <!-- shared:ds-freshness:start -->
  <script>
(() => {
  'use strict';
  const root = document.documentElement;
  const build = root.dataset.build;
  const valid = value => typeof value === 'string' && /^[a-f0-9]{12}$/.test(value);
  const visit = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  let allow, owner, inFlight, timer, sequence = 0, lastCheck = 0, settled = false, lastOutcome = true;
  let message = 'Checking for updates…', state = 'checking', registration;
  const entry = new URL(location.href), cooldown = 120000;
  const attempts = new Map();

  function paint() {
    root.dataset.dsFreshness = state;
    const status = document.querySelector('.ds-freshness-status');
    if (status && status.textContent !== message) status.textContent = message;
    const button = document.querySelector('.ds-check-updates');
    if (button) button.disabled = ['checking','checking-background','updating'].includes(state);
  }
  function status(next, text) { state = next; message = text; paint(); }
  const recent = time => Number.isFinite(time) && time > 0 && Math.abs(Date.now() - time) < cooldown;
  function attempted(version) {
    if (recent(attempts.get(version))) return true;
    if (entry.searchParams.get('v') === version && recent(Number(entry.searchParams.get('_dsrefresh')))) return true;
    try { return recent(Number(sessionStorage.getItem('portfolio:ds:refresh:' + version))); }
    catch (_) { return false; }
  }
  function remember(version) {
    const time = Date.now(); attempts.set(version,time);
    try { sessionStorage.setItem('portfolio:ds:refresh:' + version,String(time)); } catch (_) {}
    return time;
  }
  async function fresh(url) {
    url.searchParams.set('_dscheck',visit + '-' + (++sequence));
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),6000);
    try {
      const response = await fetch(url.href,{cache:'no-store',credentials:'omit',signal:controller.signal});
      if (!response.ok) throw Error('Fresh response unavailable');
      return await response.text();
    } finally { clearTimeout(timeout); }
  }
  async function verify() {
    let updateKnown = false;
    status(!settled || ['checking','waiting','updating'].includes(state) ? 'checking' : 'checking-background','Checking for updates…');
    try {
      if (!valid(build) || navigator.onLine === false) throw Error('Cannot verify');
      const version = JSON.parse(await fresh(new URL('/version.json',location.origin))).version;
      if (!valid(version)) throw Error('Invalid version');
      if (version === build) {
        if (owner && owner.document.documentElement.dataset.build !== build) {
          status('waiting','Updating the preview…');owner.DSFreshness.check({force:true});return false;
        }
        status('current','Up to date · checked ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
        return true;
      }
      updateKnown = true;
      status('waiting','An update is being published. Retrying…');
      const destination = new URL(location.href);
      destination.searchParams.set('v',version);
      const html = await fresh(new URL(destination.href));
      const tag = html.match(/<html\b[^>]*>/i)?.[0] || '';
      if (tag.match(/\bdata-build="([a-f0-9]{12})"/)?.[1] !== version || attempted(version)) return false;
      if (document.hidden || navigator.onLine === false) return false;
      destination.searchParams.set('_dsrefresh',String(remember(version)));
      status('updating','Updating the library…');
      location.replace(destination.href);
      return false;
    } catch (_) {
      if (updateKnown || (owner && owner.document.documentElement.dataset.build !== build)) { status('waiting','An update is being published. Retrying…'); return false; }
      status('unverified','Couldn’t verify the latest version. Try again.');
      return true;
    } finally { settled = true; lastCheck = Date.now(); }
  }
  function check({force = false, initial = false} = {}) {
    if (inFlight) return inFlight;
    if ((!initial && !force && document.hidden) || (!force && settled && Date.now() - lastCheck < 2000)) return Promise.resolve(lastOutcome);
    inFlight = verify().then(value => { lastOutcome = value; if (value) allow(true); return value; }).finally(() => { inFlight = null; });
    return inFlight;
  }
  const api = window.DSFreshness = {check,visit,ready:new Promise(resolve => { allow = resolve; })};

  // A parent DS document owns version polling for all its persistent previews.
  if (parent !== window) {
    try {
      if (parent.location.origin === location.origin && parent.DSFreshness) {
        const matches = parent.document.documentElement.dataset.build === build;
        status(matches ? 'current' : 'waiting',matches ? '' : 'Updating the preview…');
        if (matches) { allow(true); return; }
        owner = parent;
        parent.DSFreshness.check({force:true});
      }
    } catch (_) {}
  }
  if (entry.searchParams.get('v') === build && entry.searchParams.has('_dsrefresh')) {
    entry.searchParams.delete('_dsrefresh');
    try { history.replaceState(history.state,'',entry.href); } catch (_) {}
  }
  function sync() {
    clearInterval(timer);
    if (!document.hidden) { check(); timer = setInterval(check,30000); }
  }
  function bind() {
    paint();
    document.querySelector('.ds-check-updates')?.addEventListener('click',() => {
      registration?.update().catch(() => {});
      check({force:true});
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',bind,{once:true});
  else bind();
  if (typeof fetch !== 'function' || typeof AbortController !== 'function') {
    status('unverified','Automatic checks are unavailable in this browser.');
    allow(true);
    return;
  }
  check({initial:true});
  window.addEventListener('focus',() => check());
  window.addEventListener('online',() => check({force:true}));
  document.addEventListener('visibilitychange',sync);
  window.addEventListener('pageshow',event => { if (event.persisted) check({force:true}); sync(); });
  window.addEventListener('pagehide',() => { clearInterval(timer); status('checking','Checking for updates…'); });
  sync();

  // No offline cache or site-wide cache clearing. Only /ds/ can be controlled.
  if (navigator.serviceWorker?.register && window.isSecureContext) {
    const controlled = () => {
      const controller = navigator.serviceWorker.controller;
      root.dataset.dsNetwork = controller && new URL(controller.scriptURL).pathname === '/ds/freshness-worker.js' ? 'network-only' : 'checking';
    };
    controlled();
    navigator.serviceWorker.addEventListener('controllerchange',controlled);
    navigator.serviceWorker.register('/ds/freshness-worker.js?v=65fb10beb50c',{scope:'/ds/',updateViaCache:'none'})
      .then(value => { registration = value; controlled(); })
      .catch(() => { root.dataset.dsNetwork = 'unavailable'; });
  } else root.dataset.dsNetwork = 'unavailable';
})();
  </script>
